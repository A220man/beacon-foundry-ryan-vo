[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-foundry-ryan-vo"
version = "1.0.0"
description = "AI/ML developer tools for Apollo Guidance Computer proofing, telemetry simulation, and alignment evaluation"
authors = [
    { name = "Ryan Vo", email = "ryandtvo@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
